<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>两阶段可见性裁剪 (CPU AABB + Compute 视锥)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>

  <div id="hud">
    <h1>两阶段可见性裁剪</h1>
    <div class="row"><span>当前相机</span><b id="camera-name">—</b></div>
    <div class="row"><span>实例总数</span><b id="total-instances">—</b></div>
    <div class="row"><span>CPU 候选数 (阶段一)</span><b id="cpu-candidates">—</b></div>
    <div class="row"><span>GPU 可见数 (阶段二)</span><b id="gpu-visible">—</b></div>
    <div class="row"><span>CPU 剔除耗时</span><b id="cpu-ms">—</b> ms</div>
    <div class="row"><span>每帧总耗时</span><b id="frame-ms">—</b> ms</div>
    <div class="row"><span>CPU/GPU 集合一致性</span><span id="match-state" class="badge pending">等待回读…</span></div>
    <div id="match-detail" class="detail"></div>

    <div class="buttons">
      <button data-camera="0">相机 A 正视</button>
      <button data-camera="1">相机 B 侧视</button>
      <button data-camera="2">相机 C 俯视</button>
      <button id="btn-auto">自动巡检</button>
    </div>

    <div class="legend">
      <div><i style="background:#5c9ef2"></i>静态网格 ×121</div>
      <div><i style="background:#f29e40"></i>旋转网格 ×20</div>
      <div><i style="background:#8c8c99"></i>大遮挡体 ×1</div>
      <div><i style="background:#e64759"></i>被遮挡小模型 ×10</div>
    </div>
    <div class="note">
      被遮挡小模型仅做视锥裁剪（不做遮挡剔除），因此仍计入可见集合并通过深度测试被遮挡。<br />
      相机 far=120 覆盖全场景，对象尺寸固定，未通过缩小或拉远近平面掩盖漏裁。
    </div>
    <pre id="test-report" class="report" hidden></pre>
  </div>

  <div id="fatal"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
