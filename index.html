<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebGPU GPU Timestamp Profiler</title>
  <style>
    body { margin: 0; background: #0b0e14; color: #d7dde8;
           font: 13px/1.4 system-ui, sans-serif; }
    #gpu { width: 100vw; height: 100vh; display: block; }
    #panel { position: fixed; top: 12px; left: 12px; background: rgba(10, 14, 20, 0.82);
             padding: 10px 14px; border-radius: 8px; max-width: 460px; }
    #capability.ok { color: #7ee2a0; }
    #capability.warn { color: #f2c14e; }
    table { border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 2px 10px; text-align: right; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; }
    thead th { color: #8fa3c0; border-bottom: 1px solid #2a3548; }
    #pause { margin-top: 8px; background: #22304a; color: #d7dde8;
             border: 1px solid #3a4c6e; border-radius: 4px; padding: 4px 14px; }
    .hint { color: #8fa3c0; margin-top: 6px; }
  </style>
</head>
<body>
  <canvas id="gpu"></canvas>
  <div id="panel">
    <div id="capability">initializing…</div>
    <div id="hud"></div>
    <button id="pause">Pause</button>
    <div class="hint">Space toggles pause. Paused frames add no samples.
      Bars (bottom-left): shadow / scene / post / ui / empty.</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
