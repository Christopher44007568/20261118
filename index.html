<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGPU 异步对象拾取实验</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="gpu-canvas"></canvas>
    <pre id="hud">初始化中…</pre>
    <section id="help">
      <h1>WebGPU 异步拾取</h1>
      <p>移动鼠标：ID 通道写入 rg32uint 整数附件，经暂存缓冲池异步回读鼠标像素；
         回读结果绑定提交时的场景版本，已删除对象的旧结果会被丢弃。</p>
      <p>附加 <code>?test</code> 运行自动化对照测试（GPU 命中 vs CPU 射线）。</p>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
