<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GPU 骨骼蒙皮演示</title>
<style>
  body { margin: 0; background: #1a1d24; color: #dde; font: 14px/1.4 sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 10px; left: 10px; background: rgba(20,22,30,.85);
    padding: 12px 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px;
  }
  #panel label { display: flex; align-items: center; gap: 6px; }
  button { cursor: pointer; }
  #stats { white-space: pre; font-family: monospace; font-size: 12px; color: #9fb; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel">
  <div>
    <button id="btnRun">跑步</button>
    <button id="btnWave">挥手</button>
  </div>
  <label><input type="checkbox" id="chkSkin" checked> GPU 蒙皮（关闭显示绑定姿态）</label>
  <label>高亮骨骼
    <select id="selBone"><option value="-1">关闭</option></select>
  </label>
  <label><input type="checkbox" id="chkSkeleton" checked> 显示骨骼线</label>
  <button id="btnExport">导出每帧骨骼矩阵 + 包围盒</button>
  <div id="stats"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
