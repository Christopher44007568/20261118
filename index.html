<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顶点属性压缩实验</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #d6dae3;
      font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
    #wrap { display: flex; height: 100%; }
    #panel { width: 320px; padding: 16px; box-sizing: border-box; overflow-y: auto;
      background: #11141b; border-right: 1px solid #232733; }
    #view { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
      color: #8b93a3; margin: 16px 0 6px; }
    label { display: block; margin: 4px 0; }
    select, button { width: 100%; padding: 6px; margin-top: 4px; background: #1a1e28;
      color: #d6dae3; border: 1px solid #2c3140; border-radius: 6px; }
    .row { display: flex; gap: 6px; }
    .row button { margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { padding: 3px 4px; border-bottom: 1px solid #1e222c; text-align: right; }
    td:first-child, th:first-child { text-align: left; color: #9aa2b2; }
    .ok { color: #57d18a; } .bad { color: #ef6b6b; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 10px;
      background: #20253400; border: 1px solid #2c3140; font-size: 11px; }
    #labels { position: absolute; top: 10px; left: 0; right: 0; display: flex;
      pointer-events: none; font-weight: 600; }
    #labels span { flex: 1; text-align: center; text-shadow: 0 1px 3px #000; }
    #hint { position: absolute; bottom: 10px; left: 12px; color: #8b93a3; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="panel">
      <h1>顶点属性压缩实验</h1>
      <h2>测试网格</h2>
      <select id="mesh"></select>
      <h2>法线编码</h2>
      <select id="oct">
        <option value="oct16">oct16（2×SNORM8）</option>
        <option value="oct32">oct32（2×SNORM16）</option>
      </select>
      <h2>右侧视图模式</h2>
      <div class="row">
        <button data-view="0">还原着色</button>
        <button data-view="1">法线角误差热图</button>
        <button data-view="2">色差热图</button>
      </div>
      <h2>量化误差（原始 vs 还原）</h2>
      <table id="stats"></table>
      <h2>缓冲字节数</h2>
      <table id="bytes"></table>
      <h2>校验</h2>
      <table id="checks"></table>
      <p id="hint">拖动鼠标旋转视角</p>
    </div>
    <div id="view">
      <canvas id="gl"></canvas>
      <div id="labels"><span>原始（float32）</span><span id="rightLabel">还原（压缩缓冲）</span></div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
